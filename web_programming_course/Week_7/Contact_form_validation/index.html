<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Validation</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <a class="home-link" href="../../index.html">← All weekly homeworks</a>
        <section class="form-card">
            <p class="eyebrow">WEEK 7 / FORM VALIDATION</p>
            <h1>Contact us</h1>
            <p class="intro">Have a question or suggestion? Send us a message.</p>
            <form id="contact-form">
                <div class="field">
                    <label for="full-name">Full Name</label>
                    <input id="full-name" name="fullName" type="text" placeholder="Enter your full name" minlength="2" maxlength="60" required>
                    <small class="error" id="name-error"></small>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required>
                    <small class="error" id="email-error"></small>
                </div>
                <div class="field">
                    <label for="subject">Subject</label>
                    <input id="subject" name="subject" type="text" placeholder="What is this about?" minlength="3" maxlength="100" required>
                    <small class="error" id="subject-error"></small>
                </div>
                <div class="field">
                    <div class="label-row">
                        <label for="message">Message</label>
                        <span id="message-count">0 / 500</span>
                    </div>
                    <textarea id="message" name="message" placeholder="Write your message..." minlength="10" maxlength="500" rows="5" required></textarea>
                    <small class="error" id="message-error"></small>
                </div>
                <div class="actions">
                    <button type="submit" class="send-button">Send message</button>
                    <button type="reset" class="clear-button">Clear</button>
                </div>
                <p id="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
        <footer>Built for the Web Programming Course · <a href="https://github.com/Shuhratkhon" target="_blank" rel="noopener noreferrer">@Shuhratkhon</a></footer>
    </main>
</body>
</html>
