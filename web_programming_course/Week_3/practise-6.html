<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practise 6</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #1e293b;
      padding: 16px 28px;
    }

    .logo {
      color: white;
      font-size: 1.25rem;
      font-weight: bold;
    }

    .links {
      display: flex;
      gap: 24px;
    }

    .links a {
      color: white;
      text-decoration: none;
    }

    .links a:hover {
      color: #10b981;
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">My Site</div>
    <div class="links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Projects</a>
      <a href="#">Contact</a>
    </div>
  </nav>
</body>
</html>
