<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practise 7</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      font-family: sans-serif;
    }

    .card {
      width: 360px;
      padding: 30px;
      background-color: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    }

    .avatar {
      width: 80px;
      height: 80px;
      margin-bottom: 18px;
      border-radius: 50%;
      background-color: #15803d;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }

    .role {
      margin: 0;
      color: #64748b;
    }

    hr {
      border: 0;
      border-top: 1px solid #e2e8f0;
      margin: 24px 0;
    }

    .skills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .skill {
      padding: 6px 12px;
      border-radius: 999px;
      background-color: #dcfce7;
      color: #15803d;
      font-size: 0.9rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">A</div>
    <h1>Alex Morgan</h1>
    <p class="role">Web Developer</p>
    <hr>
    <div class="skills">
      <span class="skill">HTML</span>
      <span class="skill">CSS</span>
      <span class="skill">JavaScript</span>
      <span class="skill">Flexbox</span>
    </div>
  </div>
</body>
</html>
