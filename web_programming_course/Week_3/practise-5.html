<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practise 5</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 40px;
    }

    .box {
      width: 320px;
      padding: 20px;
      background-color: #ecfdf5;
      border: 2px solid #15803d;
      border-radius: 8px;
    }

    .box h2 {
      color: #15803d;
      font-size: 1.5rem;
    }

    .box p {
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Fixed CSS</h2>
    <p>The CSS syntax has been corrected.</p>
  </div>
</body>
</html>
