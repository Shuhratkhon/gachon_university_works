<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practise 3</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 40px;
    }

    .palette {
      display: flex;
      gap: 12px;
    }

    .swatch {
      padding: 24px 18px;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      min-width: 110px;
      text-align: center;
    }

    .one {
      background-color: #15803d;
    }

    .two {
      background-color: #0369a1;
    }

    .three {
      background-color: #7c3aed;
    }

    .four {
      background-color: #ea580c;
    }

    .five {
      background-color: #db2777;
    }
  </style>
</head>
<body>
  <div class="palette">
    <div class="swatch one">#15803d</div>
    <div class="swatch two">#0369a1</div>
    <div class="swatch three">#7c3aed</div>
    <div class="swatch four">#ea580c</div>
    <div class="swatch five">#db2777</div>
  </div>
</body>
</html>
