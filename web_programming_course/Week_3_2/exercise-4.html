<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4</title>
  <style>
    :root {
      --primary: #0f766e;
      --accent: #14b8a6;
      --bg: #f0fdfa;
      --text: #1e293b;
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #14b8a6;
        --accent: #2dd4bf;
        --bg: #051a0a;
        --text: #d4edda;
      }
    }

    body {
      margin: 0;
      padding: 40px;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
    }

    .card {
      max-width: 320px;
      padding: 24px;
      margin-top: 20px;
      background: var(--bg);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
    }

    .button {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius);
      background: var(--primary);
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="button">Primary Button</button>

  <div class="card">
    <h2>CSS Variables</h2>
    <p>This page changes its theme automatically with dark mode.</p>
  </div>
</body>
</html>
