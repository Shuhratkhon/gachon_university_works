<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <style>
      .card {
  position:relative;
  width:280px;
  height:180px;
  background:white;
  border:2px solid #14b8a6;
  border-radius:12px
}
.badge {
  position:absolute;
  top:10px;
  right:10px;
  background:#0f766e;
  color:white;
  padding:5px 12px;
  border-radius:20px
}
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">
        SALE
      </span>
    </div>
  </body>
</html>
