<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      :root {
  --bg:#f0fdfa;
  --card:#fff;
  --text:#1e293b
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:sans-serif
}
.nav {
  position:fixed;
  top:0;
  left:0;
  right:0;
  background:#1e293b;
  color:white;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  z-index:10
}
.hero {
  padding:100px 24px 40px;
  animation:fade .8s ease-out forwards
}
@keyframes fade {
  from {
  opacity:0;
  transform:translateY(30px)
}
to {
  opacity:1;
  transform:none
}

}
.heading {
  position:sticky;
  top:56px;
  background:var(--bg);
  padding:12px 24px;
  z-index:5
}
.skills {
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
  padding:24px
}
.skill {
  background:var(--card);
  padding:24px;
  border-radius:12px;
  transition:transform .25s,box-shadow .25s
}
.skill::before {
  content:'⭐ '
}
.skill:hover {
  transform:translateY(-6px);
  box-shadow:0 12px 32px rgba(15,118,110,.2)
}
@media(min-width:640px) {
  .skills {
  grid-template-columns:repeat(3,1fr)
}

}
@media(prefers-color-scheme:dark) {
  :root {
  --bg:#051a0a;
  --card:#0b2017;
  --text:#d4edda
}

}
    </style>
  </head>
  <body>
    <nav class="nav">
      <strong>
        Shuhratkhon
      </strong>
      <span>
        Portfolio
      </span>
    </nav>
    <section class="hero">
      <h1>
        Computer Engineering Portfolio
      </h1>
      <p>
        Web development and CSS projects.
      </p>
    </section>
    <h2 class="heading">
      Skills
    </h2>
    <section class="skills">
      <div class="skill">
        HTML & CSS
      </div>
      <div class="skill">
        JavaScript
      </div>
      <div class="skill">
        Python
      </div>
    </section>
  </body>
</html>
