<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><style>:root{--primary:#0f766e;--accent:#14b8a6;--bg:#f0fdfa;--text:#1e293b;--radius:12px}body{background:var(--bg);color:var(--text)}button{background:var(--primary);color:white;border:0;padding:10px 20px;border-radius:var(--radius)}.card{margin-top:20px;padding:20px;background:var(--bg);border:2px solid var(--accent);border-radius:var(--radius)}@media(prefers-color-scheme:dark){:root{--bg:#051a0a;--text:#d4edda}}</style></head><body><button>Primary Button</button><div class="card">Theme card</div></body></html>
