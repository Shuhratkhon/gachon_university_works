<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      :root {
  --primary:#0f766e;
  --bg:#f0fdfa;
  --card:#fff
}
body {
  background:var(--bg);
  font-family:sans-serif;
  padding:20px
}
.grid {
  display:grid;
  grid-template-columns:1fr;
  gap:20px
}
.card {
  background:var(--card);
  padding:24px;
  border-radius:12px;
  transition:transform .25s,box-shadow .25s
}
.card::before {
  content:'⭐ '
}
.card:hover {
  transform:translateY(-6px);
  box-shadow:0 12px 32px rgba(15,118,110,.2)
}
@media(min-width:640px) {
  .grid {
  grid-template-columns:repeat(3,1fr)
}

}
@media(prefers-color-scheme:dark) {
  :root {
  --bg:#051a0a;
  --card:#0b2017
}

}
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="card">
        CSS
      </div>
      <div class="card">
        JavaScript
      </div>
      <div class="card">
        Python
      </div>
    </div>
  </body>
</html>
