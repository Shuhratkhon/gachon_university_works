<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0fdfa;
      padding: 40px;
    }

    .card {
      width: 280px;
      padding: 24px;
      background: white;
      border: 2px solid #14b8a6;
      border-radius: 12px;
      color: #0f766e;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(15, 118, 110, 0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Hover Card</h2>
    <p>Move the mouse over this card.</p>
  </div>
</body>
</html>
