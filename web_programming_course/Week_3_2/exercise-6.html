<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 6</title>
  <style>
    :root {
      --primary: #0f766e;
      --accent: #14b8a6;
      --bg: #f0fdfa;
      --card: white;
      --text: #1e293b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #14b8a6;
        --accent: #2dd4bf;
        --bg: #051a0a;
        --card: #0b2017;
        --text: #d4edda;
      }
    }

    body {
      margin: 0;
      padding: 30px;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .card {
      padding: 24px;
      background: var(--card);
      border: 2px solid var(--accent);
      border-radius: 12px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(15, 118, 110, 0.2);
    }

    .card::before {
      content: "⭐ ";
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <h2>HTML</h2>
      <p>Structure and semantic markup.</p>
    </div>
    <div class="card">
      <h2>CSS</h2>
      <p>Styling and responsive layouts.</p>
    </div>
    <div class="card">
      <h2>JavaScript</h2>
      <p>Interactive web experiences.</p>
    </div>
  </div>
</body>
</html>
