<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 1</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0fdfa;
      padding: 40px;
    }

    .card {
      position: relative;
      width: 280px;
      height: 180px;
      background: white;
      border: 2px solid #14b8a6;
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
    }

    .badge {
      position: absolute;
      top: -10px;
      right: 12px;
      background: #0f766e;
      color: white;
      padding: 5px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
    <h2>Product Card</h2>
    <p>Position the badge in the top-right corner.</p>
  </div>
</body>
</html>
