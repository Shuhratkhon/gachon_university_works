<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <style>
      .card-grid {
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  padding:16px;
  background:#f0fdfa
}
.card {
  flex:1;
  min-width:160px;
  background:#0f766e;
  color:white;
  padding:20px;
  border-radius:10px;
  text-align:center
}
.card.featured {
  order:-1;
  flex:2;
  background:#14b8a6
}
.sidebar-layout {
  display:flex;
  gap:16px;
  margin-top:16px
}
.sidebar {
  width:180px;
  flex-shrink:0;
  background:#ccfbf1;
  padding:16px;
  border-radius:10px
}
.main {
  flex:1;
  background:white;
  border:2px solid #14b8a6;
  padding:16px;
  border-radius:10px
}
    </style>
  </head>
  <body>
    <div class="card-grid">
      <div class="card">
        A
      </div>
      <div class="card">
        B
      </div>
      <div class="card featured">
        FEATURED — order:-1, flex:2
      </div>
      <div class="card">
        C
      </div>
      <div class="card">
        D
      </div>
    </div>
    <div class="sidebar-layout">
      <aside class="sidebar">
        Sidebar (fixed 180px)
      </aside>
      <main class="main">
        Main content (flex:1)
      </main>
    </div>
  </body>
</html>
