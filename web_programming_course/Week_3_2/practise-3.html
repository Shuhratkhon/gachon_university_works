<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <style>
      @keyframes spin {
  from {
  transform:rotate(0)
}
to {
  transform:rotate(360deg)
}

}
.spinner {
  width:50px;
  height:50px;
  border:4px solid #ccfbf1;
  border-top-color:#0f766e;
  border-radius:50%;
  animation:spin .8s linear infinite
}
    </style>
  </head>
  <body>
    <div class="spinner">
    </div>
  </body>
</html>
