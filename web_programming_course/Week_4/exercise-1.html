<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 1</title>
  <style>
    .box {
      width: 120px;
      height: 60px;
      background: #0f766e;
      color: white;
      padding: 8px;
      margin: 10px;
    }

    .relative {
      position: relative;
      top: 20px;
      left: 30px;
      background: #14b8a6;
    }
  </style>
</head>
<body>
  <div class="box">Static</div>
  <div class="box relative">Relative</div>
  <div class="box">Next element</div>
</body>
</html>
