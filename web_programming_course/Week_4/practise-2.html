<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Practice 2</title>
  <style>
    .card {
      width: 280px;
      padding: 30px;
      background: #f0fdfa;
      border-radius: 12px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(15, 118, 110, 0.35);
    }
  </style>
</head>
<body>
  <div class="card">Hover over me</div>
</body>
</html>
