<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Practice 4</title>
  <style>
    :root {
      --primary: #0f766e;
      --accent: #14b8a6;
      --bg: #f0fdfa;
      --text: #1e293b;
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #5eead4;
        --accent: #14b8a6;
        --bg: #051a0a;
        --text: #d4edda;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 30px;
      font-family: sans-serif;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius);
    }

    .card {
      margin-top: 20px;
      padding: 20px;
      border: 2px solid var(--accent);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <button>Theme Button</button>
  <div class="card">CSS variable theme</div>
</body>
</html>
