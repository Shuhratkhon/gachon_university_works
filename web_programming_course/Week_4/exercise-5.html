<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 5</title>
  <style>
    .btn {
      background: #0f766e;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background: #14b8a6;
    }

    .btn:active {
      transform: scale(0.97);
    }

    input {
      border: 2px solid #94a3b8;
      border-radius: 6px;
      padding: 8px 12px;
      outline: none;
    }

    input:focus-visible {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px #99f6e4;
    }

    table {
      border-collapse: collapse;
      width: 260px;
      margin-top: 16px;
    }

    td {
      padding: 6px 12px;
    }

    tr:nth-child(even) {
      background: #f0fdfa;
    }

    tr:first-child {
      background: #0f766e;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <button class="btn">Hover & Click</button>
  <br><br>
  <input type="text" placeholder="Tab here">
  <table>
    <tr><td>Name</td><td>Score</td></tr>
    <tr><td>Alice</td><td>98</td></tr>
    <tr><td>Bob</td><td>85</td></tr>
    <tr><td>Carol</td><td>91</td></tr>
  </table>
</body>
</html>
