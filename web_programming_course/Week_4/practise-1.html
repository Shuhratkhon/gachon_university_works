<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Practice 1</title>
  <style>
    .card {
      position: relative;
      width: 280px;
      height: 180px;
      background: white;
      border: 2px solid #14b8a6;
      border-radius: 12px;
      padding: 20px;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #0f766e;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
    <h2>Product Card</h2>
  </div>
</body>
</html>
