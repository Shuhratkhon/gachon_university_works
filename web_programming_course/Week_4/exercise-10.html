<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 10</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
      background: #f0fdfa;
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: white;
      border: 2px solid #14b8a6;
      border-radius: 10px;
      padding: 20px;
      color: #0f766e;
    }

    @media (min-width: 640px) {
      .grid {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .card {
        flex: 1;
        min-width: 200px;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #051a0a;
      }

      .card {
        background: #0b2017;
        color: #d4edda;
      }
    }

    @media print {
      body {
        background: white;
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card">Card One</div>
    <div class="card">Card Two</div>
    <div class="card">Card Three</div>
  </div>
</body>
</html>
