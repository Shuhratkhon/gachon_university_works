<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 3</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    .fixed-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #0f766e;
      color: white;
      padding: 14px 24px;
      z-index: 100;
    }

    .content {
      padding-top: 60px;
    }

    .sticky-header {
      position: sticky;
      top: 56px;
      background: #ccfbf1;
      border-left: 4px solid #14b8a6;
      padding: 10px 16px;
      font-weight: bold;
      color: #0f766e;
    }

    .section-body {
      padding: 20px;
      height: 300px;
      background: #f0fdfa;
    }
  </style>
</head>
<body>
  <nav class="fixed-nav">Fixed Navigation</nav>
  <div class="content">
    <div>
      <div class="sticky-header">Section A</div>
      <div class="section-body">Scroll down to see the sticky header.</div>
    </div>
    <div>
      <div class="sticky-header">Section B</div>
      <div class="section-body">Another sticky section.</div>
    </div>
  </div>
</body>
</html>
