<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 15</title>
  <style>
    :root {
      --primary: #0f766e;
      --accent: #14b8a6;
      --bg: #f0fdfa;
      --card: #ffffff;
      --text: #1e293b;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      font-family: sans-serif;
      padding: 24px;
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .card {
      position: relative;
      background: var(--card);
      border: 2px solid #e2e8f0;
      border-radius: var(--radius);
      padding: 24px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(15, 118, 110, 0.18);
      border-color: var(--accent);
    }

    .badge {
      position: absolute;
      top: -10px;
      right: 16px;
      background: var(--primary);
      color: white;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .card-title::before {
      content: "⭐ ";
    }

    .card-title {
      color: var(--primary);
      margin-bottom: 10px;
    }

    .card-desc {
      color: #64748b;
      line-height: 1.6;
    }

    .card-price {
      color: var(--primary);
      font-size: 22px;
      font-weight: bold;
      margin-top: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #051a0a;
        --card: #0b2017;
        --text: #d4edda;
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <span class="badge">NEW</span>
      <h3 class="card-title">CSS Course</h3>
      <p class="card-desc">Master CSS from selectors to Grid.</p>
      <div class="card-price">₩49,000</div>
    </div>
    <div class="card">
      <h3 class="card-title">JS Bootcamp</h3>
      <p class="card-desc">Learn modern JavaScript fundamentals.</p>
      <div class="card-price">₩69,000</div>
    </div>
    <div class="card">
      <span class="badge">HOT</span>
      <h3 class="card-title">Full Stack</h3>
      <p class="card-desc">HTML, CSS, JavaScript, and Node.js.</p>
      <div class="card-price">₩129,000</div>
    </div>
  </div>
</body>
</html>
