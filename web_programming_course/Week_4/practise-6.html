<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice 6</title>
  <style>
    :root {
      --primary: #0f766e;
      --accent: #14b8a6;
      --bg: #f0fdfa;
      --card: white;
      --text: #1e293b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #051a0a;
        --card: #0b2017;
        --text: #d4edda;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .card {
      background: var(--card);
      padding: 25px;
      border-radius: 12px;
      transition: transform 0.25s ease;
    }

    .card::before {
      content: "💻";
      display: block;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card">HTML</div>
    <div class="card">CSS</div>
    <div class="card">JavaScript</div>
  </div>
</body>
</html>
