<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 2</title>
  <style>
    .card {
      position: relative;
      width: 280px;
      height: 160px;
      background: #f0fdfa;
      border: 2px solid #14b8a6;
      border-radius: 10px;
      margin: 40px;
    }

    .badge {
      position: absolute;
      top: -12px;
      right: -12px;
      background: #0f766e;
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">NEW</span>
    <h2>CSS Card</h2>
  </div>
</body>
</html>
