<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Project</title>
    <style>
        :root {
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
            --accent: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        .window {
            width: min(900px, 100%);
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: #1e293b;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        }

        .window-header {
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            background: linear-gradient(90deg, #1e3a8a, #312e81);
        }

        h1 { font-size: clamp(1.35rem, 4vw, 1.8rem); }
        .badge {
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.15);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .content { padding: clamp(2rem, 7vw, 4rem); }

        .project-link {
            display: inline-block;
            color: var(--text);
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 750;
            letter-spacing: -0.05em;
            line-height: 1.1;
            text-decoration: none;
            background: linear-gradient(90deg, #f1f5f9, #93c5fd, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: transform 0.2s ease;
        }

        .project-link:hover { transform: translateX(5px); }
        .hint { margin-top: 1rem; color: var(--muted); }
        .back-link { display: inline-block; margin-top: 2rem; color: #93c5fd; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 500px) {
            .window-header { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="window">
        <header class="window-header">
            <h1>Group Project</h1>
            <span class="badge">Team 2</span>
        </header>
        <section class="content">
            <a class="project-link" href="details.html" target="_blank" rel="noopener noreferrer">Overlap ↗</a>
            <p class="hint">Open Overlap to view the project details.</p>
            <a class="back-link" href="../index.html">← Back to Web Programming Course</a>
        </section>
    </main>
</body>
</html>
